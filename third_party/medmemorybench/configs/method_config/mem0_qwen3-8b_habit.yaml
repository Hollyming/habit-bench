method_name: "mem0"
method_type: "agentic_memory"
description: "HABIT adapted run: vendored Mem0 with a 10k action budget for longer user timelines"

model:
  provider: "openai"
  name: "Qwen3-8B"
  temperature: 0.0
  max_completion_tokens: 10000

embedding:
  provider: "local"
  model: "BAAI/bge-small-zh-v1.5"
  model_path: "/plm-dhw/wangjiarui/models/bge-small-zh-v1.5"
  dim: 512

agent_params:
  retrieve_num: 5
  chunk_size_tokens: 4096
  max_context_tokens: 32768
  storage_root: "/plm-dhw/wangjiarui/outputs/HABIT-bench/medmemorybench-state"
  compact_local_prompts: true
  strict_json_schema: true
  action_generation_attempts: 5
