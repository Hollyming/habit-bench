method_name: "letta"
method_type: "agentic_memory"
description: "Executable pipeline smoke config; not a paper-score reproduction"
model: {provider: "openai", name: "Qwen3-8B", temperature: 0.0, max_completion_tokens: 2048}
embedding:
  provider: "local"
  model: "BAAI/bge-small-zh-v1.5"
  model_path: "/plm-dhw/wangjiarui/models/bge-small-zh-v1.5"
  dim: 512
agent_params:
  retrieve_num: 5
  embedding_chunk_size: 4096
  context_window: 32768
  memory_persona: "I am an assistant helping with longitudinal memory."
  memory_human: "The user has a chronological history of interactions."
  memorize_chunk_tokens: 4096
  memorize_chunk_overlap_tokens: 200
  max_input_tokens: 4096
  max_question_tokens: 4096
  max_context_tokens: 32768
  enforce_memory_tool_flow: true
  message_buffer_autoclear: true
  use_native_query: false
  use_native_memorize: false
